<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herts Vapes Menu</title>
  <meta name="description" content="Herts Vapes live menu - products, prices, flavours and deals." />
  <link rel="preload" as="image" href="hero.jpg" />
  <link rel="preload" as="image" href="menu.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <!-- HERO: exact Canva artwork with invisible working buttons over the top -->
    <section class="art-section hero-section" aria-label="Herts Vapes hero">
      <img class="art-img" src="hero.jpg" alt="Herts Vapes - Fast Reliable Local" />

      <button class="hotspot hero-shop" data-open="specials" aria-label="Shop now"></button>
      <a class="hotspot hero-whatsapp" data-contact="whatsapp" href="#" aria-label="Order on WhatsApp"></a>
      <a class="hotspot hero-snapchat" data-contact="snapchat" href="#" aria-label="Order on Snapchat"></a>
    </section>

    <!-- MENU: exact Canva artwork with invisible working category buttons over the cards -->
    <section id="menu" class="art-section menu-section" aria-label="Herts Vapes menu">
      <img class="art-img" src="menu.jpg" alt="Herts Vapes Menu - shop our range" />

      <button class="hotspot card-specials" data-open="specials" aria-label="Open Special Deals"></button>
      <button class="hotspot card-disposables" data-open="disposables" aria-label="Open Disposable Vapes"></button>
      <button class="hotspot card-podkits" data-open="podkits" aria-label="Open Pod Kits"></button>
      <button class="hotspot card-nicsalts" data-open="nicsalts" aria-label="Open Nic Salts"></button>
      <button class="hotspot card-pods" data-open="pods" aria-label="Open Replacement Pods"></button>
      <button class="hotspot card-pouches" data-open="pouches" aria-label="Open Nicotine Pouches"></button>
      <a class="hotspot menu-whatsapp" data-contact="whatsapp" href="#" aria-label="Order on WhatsApp"></a>
      <a class="hotspot menu-snapchat" data-contact="snapchat" href="#" aria-label="Order on Snapchat"></a>
    </section>

    <!-- PRACTICAL PRODUCT SYSTEM -->
    <section id="products" class="products-panel" aria-label="Products and prices">
      <div class="panel-header">
        <p class="eyebrow">LIVE MENU</p>
        <h1 id="activeTitle">Tap a category above</h1>
        <p class="panel-note">Open a product to view flavours, then message on WhatsApp or Snapchat to order.</p>
      </div>

      <div id="categoryContent" class="category-content"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
