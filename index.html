<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Herts Vapes Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero" id="top">
      <img src="hero.jpg" alt="Herts Vapes" class="hero-art" />
      <button class="hotspot shop-hotspot" data-scroll="#menu" aria-label="Shop now"></button>
      <a class="hotspot hero-whatsapp" href="https://wa.me/447000000000?text=Hi%2C%20I%27d%20like%20to%20place%20an%20order" aria-label="Order on WhatsApp"></a>
      <a class="hotspot hero-snapchat" href="https://www.snapchat.com/add/YOUR_SNAPCHAT_USERNAME" aria-label="Order on Snapchat"></a>
    </section>

    <section class="menu-visual" id="menu">
      <img src="menu.jpg" alt="Herts Vapes menu categories" class="menu-art" />
      <button class="hotspot cat special" data-category="special" aria-label="Open Special Deals"></button>
      <button class="hotspot cat disposable" data-category="disposable" aria-label="Open Disposable Vapes"></button>
      <button class="hotspot cat podkits" data-category="podkits" aria-label="Open Pod Kits"></button>
      <button class="hotspot cat salts" data-category="salts" aria-label="Open Nic Salts"></button>
      <button class="hotspot cat pods" data-category="pods" aria-label="Open Replacement Pods"></button>
      <button class="hotspot cat pouches" data-category="pouches" aria-label="Open Nicotine Pouches"></button>
      <a class="hotspot menu-whatsapp" href="https://wa.me/447000000000?text=Hi%2C%20I%27d%20like%20to%20place%20an%20order" aria-label="Order on WhatsApp"></a>
      <a class="hotspot menu-snapchat" href="https://www.snapchat.com/add/YOUR_SNAPCHAT_USERNAME" aria-label="Order on Snapchat"></a>
    </section>

    <section class="live-panel" id="live-panel" aria-live="polite">
      <div class="panel-head">
        <button class="back-btn" id="closePanel" aria-label="Close menu">‹</button>
        <div>
          <p class="eyebrow">LIVE MENU</p>
          <h2 id="panelTitle">SPECIAL DEALS</h2>
        </div>
      </div>
      <div id="panelContent" class="panel-content"></div>
    </section>
  </main>

  <nav class="floating-order" aria-label="Order buttons">
    <a href="https://wa.me/447000000000?text=Hi%2C%20I%27d%20like%20to%20place%20an%20order" class="float-link">WhatsApp</a>
    <span></span>
    <a href="https://www.snapchat.com/add/YOUR_SNAPCHAT_USERNAME" class="float-link">Snapchat</a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
